<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vòng Quay May Mắn 1-42</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      overflow-x: hidden;
      padding: 20px;
      position: relative;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      background: linear-gradient(90deg, #ffd700, #ffaa00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #a0aec0;
      margin-bottom: 24px;
      font-size: 1rem;
    }

    .wheel-container {
      position: relative;
      width: min(90vw, 400px);
      height: min(90vw, 400px);
      margin-bottom: 24px;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 
        0 0 0 8px #ffd700,
        0 0 0 12px #1a1a2e,
        0 0 40px rgba(255, 215, 0, 0.4);
      background: #1a1a2e;
    }

    .pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 36px solid #ffd700;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
      z-index: 10;
    }

    .pointer::after {
      content: '';
      position: absolute;
      top: -36px;
      left: -8px;
      width: 16px;
      height: 16px;
      background: #ffd700;
      border-radius: 50%;
      border: 3px solid #1a1a2e;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 420px;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #spinBtn, #clearHistoryBtn {
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #spinBtn {
      color: #1a1a2e;
      background: linear-gradient(180deg, #ffd700 0%, #ffaa00 100%);
      box-shadow: 0 5px 0 #cc8800, 0 8px 16px rgba(0,0,0,0.3);
    }

    #spinBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #cc8800, 0 12px 20px rgba(0,0,0,0.35);
    }

    #spinBtn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #cc8800, 0 4px 8px rgba(0,0,0,0.3);
    }

    #spinBtn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #clearHistoryBtn {
      color: #fff;
      background: linear-gradient(180deg, #e74c3c 0%, #c0392b 100%);
      box-shadow: 0 5px 0 #922b21, 0 8px 16px rgba(0,0,0,0.3);
    }

    #clearHistoryBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #922b21, 0 12px 20px rgba(0,0,0,0.35);
    }

    #clearHistoryBtn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #922b21;
    }

    .result-box {
      min-height: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      border: 1px solid rgba(255,215,0,0.3);
      min-width: 200px;
    }

    .result-label {
      font-size: 0.85rem;
      color: #a0aec0;
      margin-bottom: 2px;
    }

    #result {
      font-size: 2.8rem;
      font-weight: 800;
      color: #ffd700;
      text-shadow: 0 0 18px rgba(255, 215, 0, 0.6);
      transition: all 0.25s ease;
    }

    .history {
      margin-top: 20px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .history h3 {
      font-size: 0.95rem;
      color: #a0aec0;
      margin-bottom: 10px;
    }

    #historyList {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .history-item {
      background: rgba(255,215,0,0.15);
      border: 1px solid rgba(255,215,0,0.4);
      color: #ffd700;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    footer {
      margin-top: 28px;
      color: #64748b;
      font-size: 0.8rem;
    }

    /* ===== HIỆU ỨNG TUNG HÔ ===== */
    #celebration {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #celebration.show {
      display: flex;
    }

    .celeb-text {
      font-size: clamp(2.5rem, 10vw, 4.5rem);
      font-weight: 900;
      color: #ffd700;
      text-shadow: 
        0 0 20px rgba(255,215,0,0.8),
        0 0 40px rgba(255,100,0,0.6),
        0 4px 0 #cc8800;
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      text-align: center;
      line-height: 1.2;
    }

    .celeb-sub {
      margin-top: 12px;
      font-size: 1.4rem;
      color: #fff;
      opacity: 0;
      animation: fadeUp 0.5s 0.3s forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeUp {
      0% { transform: translateY(20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .confetti {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>🎡 Vòng Quay May Mắn</h1>
  <p class="subtitle">Các số từ 1 đến 42 • Quay ngẫu nhiên</p>

  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheel" width="500" height="500"></canvas>
  </div>

  <div class="controls">
    <div class="btn-row">
      <button id="spinBtn">QUAY NGAY</button>
      <button id="clearHistoryBtn">XÓA LỊCH SỬ</button>
    </div>
    
    <div class="result-box">
      <div class="result-label">Kết quả</div>
      <div id="result">—</div>
    </div>
  </div>

  <div class="history">
    <h3>Lịch sử quay gần đây</h3>
    <div id="historyList"></div>
  </div>

  <footer>Nhấn Space để quay nhanh</footer>

  <!-- Lớp hiệu ứng tung hô -->
  <div id="celebration">
    <div class="celeb-text" id="celebText">🎉 CHÚC MỪNG!</div>
    <div class="celeb-sub" id="celebSub">Bạn đã quay được số đặc biệt</div>
  </div>

  <script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const resultEl = document.getElementById('result');
    const historyList = document.getElementById('historyList');
    const celebration = document.getElementById('celebration');
    const celebText = document.getElementById('celebText');
    const celebSub = document.getElementById('celebSub');

    const numbers = Array.from({ length: 42 }, (_, i) => i + 1);
    const colors = [
      '#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6',
      '#1abc9c', '#e67e22', '#34495e', '#e91e63', '#00bcd4',
      '#8bc34a', '#ff5722', '#673ab7', '#009688', '#ff9800',
      '#3f51b5', '#cddc39', '#795548', '#607d8b', '#f44336',
      '#2196f3', '#4caf50', '#ffc107', '#9c27b0', '#00acc1',
      '#7cb342', '#ff7043', '#5e35b1', '#26a69a', '#ffa726',
      '#5c6bc0', '#d4e157', '#8d6e63', '#78909c', '#ef5350',
      '#42a5f5', '#66bb6a', '#ffca28', '#ab47bc', '#26c6da',
      '#9ccc65', '#ff8a65'
    ];

    // ===== SỐ CHỈ ĐỊNH SẴN (chạy ngầm) =====
    const PRESET = [3, 5, 15, 37];

    // Lấy vị trí đã quay từ localStorage (chung cho tất cả lần mở)
    let presetIndex = parseInt(localStorage.getItem('wheelPresetIndex')) || 0;

    // ===== SỐ ĐẶC BIỆT SẼ CÓ HIỆU ỨNG TUNG HÔ =====
    const SPECIAL_NUMBERS = [3, 5, 15, 37, 7, 14, 21, 28, 35, 42];

    const size = canvas.width;
    const center = size / 2;
    const radius = center - 10;
    const segmentAngle = (2 * Math.PI) / numbers.length;

    let currentRotation = 0;
    let isSpinning = false;
    let history = [];

    function drawWheel(rotation = 0) {
      ctx.clearRect(0, 0, size, size);
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(rotation);

      numbers.forEach((num, i) => {
        const startAngle = i * segmentAngle - Math.PI / 2;
        const endAngle = startAngle + segmentAngle;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.save();
        ctx.rotate(startAngle + segmentAngle / 2);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px Segoe UI, system-ui, sans-serif';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 3;
        ctx.fillText(num.toString(), radius * 0.72, 0);
        ctx.restore();
      });

      ctx.beginPath();
      ctx.arc(0, 0, 26, 0, 2 * Math.PI);
      ctx.fillStyle = '#1a1a2e';
      ctx.fill();
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffd700';
      ctx.fill();

      ctx.restore();
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    // ===== HIỆU ỨNG TUNG HÔ =====
    function showCelebration(number) {
      celebration.querySelectorAll('.confetti').forEach(el => el.remove());

      celebText.textContent = `🎉 ${number} 🎉`;
      celebSub.textContent = 'Chúc mừng bạn đã quay được số đặc biệt!';
      celebration.classList.add('show');

      const confettiColors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7', '#dfe6e9', '#fd79a8'];
      for (let i = 0; i < 80; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
        confetti.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
        confetti.style.animationDelay = (Math.random() * 0.8) + 's';
        confetti.style.width = (Math.random() * 10 + 6) + 'px';
        confetti.style.height = (Math.random() * 10 + 6) + 'px';
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        celebration.appendChild(confetti);
      }

      setTimeout(() => {
        celebration.classList.remove('show');
      }, 3500);
    }

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      spinBtn.disabled = true;
      resultEl.textContent = '...';
      resultEl.style.transform = 'scale(1)';

      // Quyết định số thắng
      let targetNumber;
      if (presetIndex < PRESET.length) {
        targetNumber = PRESET[presetIndex];
        presetIndex++;
        // Lưu lại vị trí mới để lần mở sau (hoặc file khác) tiếp tục đúng
        localStorage.setItem('wheelPresetIndex', presetIndex);
      } else {
        targetNumber = numbers[Math.floor(Math.random() * numbers.length)];
      }

      const targetIndex = numbers.indexOf(targetNumber);
      const targetRotation = -(targetIndex * segmentAngle + segmentAngle / 2);
      const extraSpins = 5 + Math.floor(Math.random() * 3);
      const finalRotation = currentRotation + extraSpins * 2 * Math.PI +
                            (targetRotation - (currentRotation % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

      const duration = 4500 + Math.random() * 1000;
      const startTime = performance.now();
      const startRotation = currentRotation;

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = easeOutCubic(progress);

        currentRotation = startRotation + (finalRotation - startRotation) * eased;
        drawWheel(currentRotation);

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          currentRotation = finalRotation;
          drawWheel(currentRotation);

          resultEl.textContent = targetNumber;
          resultEl.style.transform = 'scale(1.15)';
          setTimeout(() => resultEl.style.transform = 'scale(1)', 200);

          history.unshift(targetNumber);
          if (history.length > 10) history.pop();
          renderHistory();

          // Kiểm tra số đặc biệt → tung hô
          if (SPECIAL_NUMBERS.includes(targetNumber)) {
            setTimeout(() => showCelebration(targetNumber), 300);
          }

          isSpinning = false;
          spinBtn.disabled = false;
        }
      }

      requestAnimationFrame(animate);
    }

    function renderHistory() {
      historyList.innerHTML = history
        .map(n => `<span class="history-item">${n}</span>`)
        .join('');
    }

    // === Sự kiện ===
    spinBtn.addEventListener('click', spin);

    clearHistoryBtn.addEventListener('click', () => {
      history = [];
      renderHistory();
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !isSpinning) {
        e.preventDefault();
        spin();
      }
    });

    // Khởi tạo
    drawWheel();
  </script>
</body>
</html>
