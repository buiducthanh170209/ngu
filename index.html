
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Phát hiện Buồn ngủ</title>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/dist/face-api.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: #0b1120;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      padding: 12px 16px 8px;
      text-align: center;
      background: linear-gradient(180deg, #1e293b 0%, transparent 100%);
    }
    .header h1 {
      font-size: 1.35rem;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }
    .header p { font-size: 0.8rem; color: #64748b; margin-top: 2px; }

    /* Video area */
    .video-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      aspect-ratio: 4/3;
      background: #020617;
      border-radius: 0;
      overflow: hidden;
    }
    @media (min-width: 500px) {
      .video-wrap { border-radius: 16px; margin-top: 8px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    }
    video, canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
    canvas { position: absolute; top: 0; left: 0; }

    #loading {
      position: absolute; inset: 0; background: #020617;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; font-size: 0.95rem; color: #94a3b8;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #334155;
      border-top-color: #38bdf8; border-radius: 50%;
      animation: spin 0.7s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Status bar */
    .status-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px 12px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }
    .stat-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      border: 1px solid #334155;
    }
    .stat-card .label { font-size: 0.7rem; color: #64748b; margin-bottom: 2px; }
    .stat-card .val { font-size: 1.25rem; font-weight: 700; }
    #earVal { color: #38bdf8; }
    #statusVal { color: #4ade80; }

    /* Controls */
    .controls {
      display: flex;
      gap: 8px;
      padding: 8px 12px 4px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      transition: transform 0.15s, opacity 0.15s;
      flex: 1;
      min-width: 90px;
      max-width: 140px;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #3b82f6; }
    .btn-danger { background: #ef4444; }
    .btn-success { background: #22c55e; }
    .btn-secondary { background: #475569; }

    /* Settings */
    .settings {
      margin: 10px 12px 20px;
      max-width: 480px;
      width: calc(100% - 24px);
      margin-left: auto;
      margin-right: auto;
      background: #1e293b;
      border-radius: 14px;
      border: 1px solid #334155;
      overflow: hidden;
    }
    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
    }
    .settings-header h2 { font-size: 0.95rem; font-weight: 600; }
    .settings-header .chevron {
      transition: transform 0.25s;
      font-size: 0.85rem;
      color: #64748b;
    }
    .settings-header.open .chevron { transform: rotate(180deg); }
    .settings-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .settings-body.open { max-height: 420px; }
    .setting-item {
      padding: 12px 16px;
      border-top: 1px solid #334155;
    }
    .setting-item label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .setting-item label span.num {
      background: #0f172a;
      padding: 2px 8px;
      border-radius: 6px;
      color: #38bdf8;
      font-weight: 600;
      font-size: 0.9rem;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: #334155;
      border-radius: 3px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      background: #3b82f6;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .hint { font-size: 0.72rem; color: #64748b; margin-top: 4px; }

    /* Toggle row */
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-top: 1px solid #334155;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .toggle {
      width: 48px;
      height: 28px;
      background: #334155;
      border-radius: 14px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle.on { background: #3b82f6; }
    .toggle::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(20px); }

    /* Log */
    .log-box {
      max-height: 100px;
      overflow-y: auto;
      padding: 8px 16px 12px;
      font-size: 0.75rem;
      color: #94a3b8;
      border-top: 1px solid #334155;
    }
    .log-box div { margin-bottom: 3px; }

    /* Alert overlay */
    .alert-box {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(185, 28, 28, 0.94);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: pulse 0.65s infinite;
      padding: 20px;
      text-align: center;
    }
    .alert-box.show { display: flex; }
    .alert-box h2 { font-size: 2.2rem; margin-bottom: 10px; }
    .alert-box p { font-size: 1.15rem; opacity: 0.95; }
    .alert-box .dismiss {
      margin-top: 24px;
      background: rgba(255,255,255,0.2);
      border: 2px solid #fff;
      color: #fff;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.85} }

    /* Bottom safe area */
    .safe-bottom { height: env(safe-area-inset-bottom, 12px); }
  </style>
</head>
<body>
  <div class="header">
    <h1>😴 Phát hiện Buồn ngủ</h1>
    <p>Tối ưu cho điện thoại</p>
  </div>

  <div class="video-wrap">
    <div id="loading">
      <div class="spinner"></div>
      <div id="loadingText">Đang tải AI...</div>
    </div>
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="status-bar">
    <div class="stat-card">
      <div class="label">EAR (Mắt)</div>
      <div class="val" id="earVal">--</div>
    </div>
    <div class="stat-card">
      <div class="label">Trạng thái</div>
      <div class="val" id="statusVal">Chờ...</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="startBtn" disabled>Bắt đầu</button>
    <button class="btn btn-danger" id="stopBtn" disabled>Dừng</button>
    <button class="btn btn-success" id="testSoundBtn">Thử loa</button>
  </div>

  <!-- Settings -->
  <div class="settings">
    <div class="settings-header" id="settingsToggle">
      <h2>⚙️ Cài đặt</h2>
      <span class="chevron">▼</span>
    </div>
    <div class="settings-body" id="settingsBody">
      <div class="setting-item">
        <label>
          <span>Độ nhạy mắt (EAR)</span>
          <span class="num" id="earNum">0.30</span>
        </label>
        <input type="range" id="earSlider" min="0.15" max="0.40" step="0.01" value="0.30" />
        <div class="hint">Cao = nhạy hơn · Thấp = khó báo hơn</div>
      </div>

      <div class="setting-item">
        <label>
          <span>Thời gian xác nhận</span>
          <span class="num" id="frameNum">8 frame</span>
        </label>
        <input type="range" id="frameSlider" min="3" max="25" step="1" value="8" />
        <div class="hint">Ít frame = báo nhanh hơn</div>
      </div>

      <div class="setting-item">
        <label>
          <span>Âm lượng cảnh báo</span>
          <span class="num" id="volNum">70%</span>
        </label>
        <input type="range" id="volSlider" min="10" max="100" step="5" value="70" />
      </div>

      <div class="toggle-row">
        <span>Rung khi cảnh báo (điện thoại)</span>
        <div class="toggle on" id="vibrateToggle"></div>
      </div>

      <div class="toggle-row">
        <span>Giữ màn hình sáng</span>
        <div class="toggle on" id="wakeToggle"></div>
      </div>

      <div class="log-box" id="logBox">
        <div>• Sẵn sàng</div>
      </div>
    </div>
  </div>

  <div class="safe-bottom"></div>

  <!-- Alert -->
  <div class="alert-box" id="alertBox">
    <h2>⚠️ CẢNH BÁO!</h2>
    <p>Bạn đang buồn ngủ!<br>Hãy tỉnh táo lại.</p>
    <button class="dismiss" id="dismissBtn">Tắt cảnh báo</button>
  </div>

  <script>
    // ===== DOM =====
    const video = document.getElementById('video');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const earVal = document.getElementById('earVal');
    const statusVal = document.getElementById('statusVal');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const testSoundBtn = document.getElementById('testSoundBtn');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');
    const alertBox = document.getElementById('alertBox');
    const dismissBtn = document.getElementById('dismissBtn');
    const logBox = document.getElementById('logBox');

    // Settings
    const earSlider = document.getElementById('earSlider');
    const frameSlider = document.getElementById('frameSlider');
    const volSlider = document.getElementById('volSlider');
    const earNum = document.getElementById('earNum');
    const frameNum = document.getElementById('frameNum');
    const volNum = document.getElementById('volNum');
    const vibrateToggle = document.getElementById('vibrateToggle');
    const wakeToggle = document.getElementById('wakeToggle');
    const settingsToggle = document.getElementById('settingsToggle');
    const settingsBody = document.getElementById('settingsBody');

    // ===== STATE =====
    let isRunning = false;
    let consecutiveClosed = 0;
    let EAR_THRESHOLD = 0.30;
    let FRAMES_TO_ALERT = 8;
    let VOLUME = 0.7;
    let VIBRATE_ON = true;
    let WAKE_LOCK = true;
    let wakeLockObj = null;
    let audioCtx = null;
    let isBeeping = false;
    let beepInterval = null;

    // Load saved settings
    function loadSettings() {
      try {
        const s = JSON.parse(localStorage.getItem('drowsySettings') || '{}');
        if (s.ear) { EAR_THRESHOLD = s.ear; earSlider.value = s.ear; earNum.textContent = s.ear.toFixed(2); }
        if (s.frames) { FRAMES_TO_ALERT = s.frames; frameSlider.value = s.frames; frameNum.textContent = s.frames + ' frame'; }
        if (s.vol) { VOLUME = s.vol; volSlider.value = s.vol * 100; volNum.textContent = Math.round(s.vol * 100) + '%'; }
        if (s.vibrate !== undefined) { VIBRATE_ON = s.vibrate; vibrateToggle.classList.toggle('on', s.vibrate); }
        if (s.wake !== undefined) { WAKE_LOCK = s.wake; wakeToggle.classList.toggle('on', s.wake); }
      } catch(e) {}
    }
    function saveSettings() {
      localStorage.setItem('drowsySettings', JSON.stringify({
        ear: EAR_THRESHOLD, frames: FRAMES_TO_ALERT, vol: VOLUME,
        vibrate: VIBRATE_ON, wake: WAKE_LOCK
      }));
    }
    loadSettings();

    // ===== LOG =====
    function log(msg) {
      const time = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const div = document.createElement('div');
      div.textContent = `• ${time} ${msg}`;
      logBox.prepend(div);
      if (logBox.children.length > 15) logBox.lastChild.remove();
    }

    // ===== AUDIO =====
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playBeep() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'square';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(VOLUME * 0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.22);
    }
    function startAlarm() {
      if (isBeeping) return;
      isBeeping = true;
      initAudio();
      playBeep();
      beepInterval = setInterval(playBeep, 380);
      if (VIBRATE_ON && navigator.vibrate) {
        navigator.vibrate([200, 100, 200, 100, 400]);
      }
    }
    function stopAlarm() {
      isBeeping = false;
      if (beepInterval) { clearInterval(beepInterval); beepInterval = null; }
      if (navigator.vibrate) navigator.vibrate(0);
    }

    // ===== WAKE LOCK =====
    async function requestWakeLock() {
      if (!WAKE_LOCK || !('wakeLock' in navigator)) return;
      try {
        wakeLockObj = await navigator.wakeLock.request('screen');
        log('Giữ màn hình sáng');
      } catch(e) {}
    }
    function releaseWakeLock() {
      if (wakeLockObj) { wakeLockObj.release(); wakeLockObj = null; }
    }

    // ===== UI EVENTS =====
    settingsToggle.addEventListener('click', () => {
      settingsToggle.classList.toggle('open');
      settingsBody.classList.toggle('open');
    });

    earSlider.addEventListener('input', () => {
      EAR_THRESHOLD = parseFloat(earSlider.value);
      earNum.textContent = EAR_THRESHOLD.toFixed(2);
      saveSettings();
    });
    frameSlider.addEventListener('input', () => {
      FRAMES_TO_ALERT = parseInt(frameSlider.value);
      frameNum.textContent = FRAMES_TO_ALERT + ' frame';
      saveSettings();
    });
    volSlider.addEventListener('input', () => {
      VOLUME = parseInt(volSlider.value) / 100;
      volNum.textContent = Math.round(VOLUME * 100) + '%';
      saveSettings();
    });
    vibrateToggle.addEventListener('click', () => {
      VIBRATE_ON = !VIBRATE_ON;
      vibrateToggle.classList.toggle('on', VIBRATE_ON);
      saveSettings();
      if (VIBRATE_ON && navigator.vibrate) navigator.vibrate(50);
    });
    wakeToggle.addEventListener('click', () => {
      WAKE_LOCK = !WAKE_LOCK;
      wakeToggle.classList.toggle('on', WAKE_LOCK);
      saveSettings();
      if (WAKE_LOCK) requestWakeLock(); else releaseWakeLock();
    });

    testSoundBtn.addEventListener('click', () => {
      initAudio();
      playBeep();
      setTimeout(playBeep, 280);
      setTimeout(playBeep, 560);
      if (VIBRATE_ON && navigator.vibrate) navigator.vibrate(80);
    });

    dismissBtn.addEventListener('click', () => {
      alertBox.classList.remove('show');
      stopAlarm();
      consecutiveClosed = 0;
    });

    // ===== DETECTION =====
    function distance(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }
    function getEAR(eye) {
      const A = distance(eye[1], eye[5]);
      const B = distance(eye[2], eye[4]);
      const C = distance(eye[0], eye[3]);
      return (A + B) / (2 * C);
    }

    async function setupCamera() {
      // Ưu tiên camera trước trên điện thoại
      const constraints = {
        video: {
          facingMode: 'user',
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      return new Promise(r => {
        video.onloadedmetadata = () => { video.play(); r(); };
      });
    }

    async function loadModels() {
      loadingText.textContent = 'Đang tải model...';
      const URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/model';
      await faceapi.nets.tinyFaceDetector.loadFromUri(URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(URL);
    }

    async function detect() {
      if (!isRunning) return;
      try {
        const detections = await faceapi
          .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 }))
          .withFaceLandmarks();

        const size = { width: video.videoWidth, height: video.videoHeight };
        faceapi.matchDimensions(canvas, size);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (detections?.length > 0) {
          const resized = faceapi.resizeResults(detections, size);
          const lm = resized[0].landmarks;
          const avgEAR = (getEAR(lm.getLeftEye()) + getEAR(lm.getRightEye())) / 2;

          faceapi.draw.drawDetections(canvas, resized);
          faceapi.draw.drawFaceLandmarks(canvas, resized);

          earVal.textContent = avgEAR.toFixed(3);

          if (avgEAR < EAR_THRESHOLD) {
            consecutiveClosed++;
            statusVal.textContent = 'Nhắm mắt...';
            statusVal.style.color = '#fbbf24';
          } else {
            consecutiveClosed = 0;
            statusVal.textContent = 'Tỉnh táo';
            statusVal.style.color = '#4ade80';
            if (alertBox.classList.contains('show')) {
              alertBox.classList.remove('show');
              stopAlarm();
            }
          }

          if (consecutiveClosed >= FRAMES_TO_ALERT) {
            statusVal.textContent = 'BUỒN NGỦ!';
            statusVal.style.color = '#f87171';
            if (!alertBox.classList.contains('show')) {
              alertBox.classList.add('show');
              startAlarm();
              log('⚠️ Cảnh báo buồn ngủ');
            }
          }
        } else {
          earVal.textContent = '--';
          statusVal.textContent = 'Không thấy mặt';
          statusVal.style.color = '#94a3b8';
          consecutiveClosed = 0;
        }
      } catch (e) { console.error(e); }
      requestAnimationFrame(detect);
    }

    async function start() {
      try {
        initAudio();
        startBtn.disabled = true;
        statusVal.textContent = 'Mở camera...';
        await setupCamera();
        isRunning = true;
        stopBtn.disabled = false;
        statusVal.textContent = 'Đang theo dõi';
        statusVal.style.color = '#4ade80';
        log('Bắt đầu theo dõi');
        requestWakeLock();
        detect();
      } catch (e) {
        console.error(e);
        alert('Không mở được camera.\nHãy cho phép quyền Camera và thử lại.');
        startBtn.disabled = false;
        log('Lỗi camera');
      }
    }

    function stop() {
      isRunning = false;
      stopBtn.disabled = true;
      startBtn.disabled = false;
      alertBox.classList.remove('show');
      stopAlarm();
      releaseWakeLock();
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      statusVal.textContent = 'Đã dừng';
      statusVal.style.color = '#94a3b8';
      earVal.textContent = '--';
      log('Đã dừng');
    }

    // Init
    (async () => {
      try {
        await loadModels();
        loading.style.display = 'none';
        startBtn.disabled = false;
        statusVal.textContent = 'Sẵn sàng';
        log('Model đã tải xong');
      } catch (e) {
        console.error(e);
        loadingText.innerHTML = '<span style="color:#f87171">Lỗi tải model<br>Thử F5 / Chrome</span>';
        log('Lỗi tải model');
      }
    })();

    startBtn.addEventListener('click', start);
    stopBtn.addEventListener('click', stop);
  </script>
</body>
</html>
